<svg width="1600" height="320" viewBox="0 0 1600 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EARLY Deck — time tracking for Stream Deck and OpenDeck">
	<style>
		.bg { fill: #ffffff; }
		.border { stroke: #d0d7de; }
		.title { fill: #0d1117; }
		.subtitle { fill: #57606a; }
		.key { fill: #eef2f6; stroke: #d0d7de; }
		.key-accent { fill: #0d9488; }
		.play { fill: #ffffff; }

		@media (prefers-color-scheme: dark) {
			.bg { fill: #0d1117; }
			.border { stroke: #30363d; }
			.title { fill: #e6edf3; }
			.subtitle { fill: #8b949e; }
			.key { fill: #161b22; stroke: #30363d; }
			.key-accent { fill: #2dd4bf; }
			.play { fill: #0d1117; }
		}
	</style>

	<rect x="1" y="1" width="1598" height="318" rx="20" class="bg border" stroke-width="2" />

	<!-- 3x3 "Stream Deck" key grid, centre key accented as the tracked activity -->
	<g transform="translate(88, 88)">
		<g>
			<rect x="0"   y="0"   width="42" height="42" rx="9" class="key" stroke-width="2" />
			<rect x="56"  y="0"   width="42" height="42" rx="9" class="key" stroke-width="2" />
			<rect x="112" y="0"   width="42" height="42" rx="9" class="key" stroke-width="2" />

			<rect x="0"   y="56"  width="42" height="42" rx="9" class="key" stroke-width="2" />
			<rect x="56"  y="56"  width="42" height="42" rx="9" class="key-accent" />
			<rect x="112" y="56"  width="42" height="42" rx="9" class="key" stroke-width="2" />

			<rect x="0"   y="112" width="42" height="42" rx="9" class="key" stroke-width="2" />
			<rect x="56"  y="112" width="42" height="42" rx="9" class="key" stroke-width="2" />
			<rect x="112" y="112" width="42" height="42" rx="9" class="key" stroke-width="2" />

			<path d="M 71 71 L 90 77 L 71 83 Z" class="play" />
		</g>
	</g>

	<!-- Wordmark -->
	<g transform="translate(300, 0)">
		<text x="0" y="150" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" class="title">EARLY Deck</text>
		<text x="4" y="192" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" class="subtitle">Hassle-free time tracking for Stream Deck &amp; OpenDeck</text>
		<text x="4" y="226" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" class="subtitle">Powered by the EARLY API (formerly Timeular)</text>
	</g>
</svg>
