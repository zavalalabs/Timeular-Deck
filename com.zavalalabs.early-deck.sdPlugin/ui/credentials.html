<!doctype html>
<html>
	<head lang="en">
		<title>EARLY Deck Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="API Key">
			<sdpi-textfield setting="apiKey" global></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="API Secret">
			<sdpi-textfield setting="apiSecret" type="password" global></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="">
			<span>
				Generate an API Key &amp; Secret at
				<a href="https://early.app" target="_blank" rel="noopener">early.app</a>
				under your profile's Public API settings. They're shared by every EARLY Deck key.
			</span>
		</sdpi-item>
	</body>
</html>
